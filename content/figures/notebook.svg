<svg viewBox="0 0 420 250" role="img" aria-labelledby="nb-t nb-d" class="drawn">
  <title id="nb-t">The notebook that keeps notes</title>
  <desc id="nb-d">An open spiral notebook with writing on both pages that stays, and a red bookmark ribbon. A red
    note reads: unlike the whiteboard, this one keeps the notes.</desc>
  <defs>
    <filter id="nb-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="nb-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- pages -->
  <g filter="url(#nb-rough)" fill="#F1EEE7" stroke="#232120" stroke-linejoin="round">
    <path d="M66,70 C120,58 180,58 210,72 L210,186 C180,172 120,172 66,184 Z" stroke-width="2.6"/>
    <path d="M354,70 C300,58 240,58 210,72 L210,186 C240,172 300,172 354,184 Z" stroke-width="2.6"/>
  </g>
  <!-- spiral binding -->
  <g filter="url(#nb-rough2)" fill="none" stroke="#232120" stroke-width="2" stroke-linecap="round">
    <path d="M204,66 C214,62 214,74 204,72 M204,86 C214,82 214,94 204,92 M204,106 C214,102 214,114 204,112 M204,126 C214,122 214,134 204,132 M204,146 C214,142 214,154 204,152 M204,166 C214,162 214,174 204,172"/>
  </g>
  <!-- writing, left page -->
  <g filter="url(#nb-rough2)" fill="none" stroke="#232120" stroke-width="1.9" stroke-linecap="round">
    <path d="M82,92 C118,86 156,90 190,88"/>
    <path d="M82,110 C114,104 150,108 186,106"/>
    <path d="M82,128 C112,122 148,126 188,124"/>
    <path d="M82,146 C110,141 142,145 176,143"/>
  </g>
  <!-- writing, right page -->
  <g filter="url(#nb-rough2)" fill="none" stroke="#232120" stroke-width="1.9" stroke-linecap="round">
    <path d="M230,90 C266,84 304,88 338,90"/>
    <path d="M234,108 C266,103 302,107 336,108"/>
    <path d="M234,126 C264,121 300,125 334,126"/>
    <path d="M238,144 C266,140 298,143 330,145"/>
  </g>
  <!-- bookmark -->
  <g filter="url(#nb-rough2)" fill="#BE3A22" stroke="#BE3A22" stroke-linejoin="round">
    <path d="M300,60 L316,62 L314,104 L308,96 L302,102 Z"/>
  </g>

  <!-- red note -->
  <text x="40" y="228" font-family="Fraunces,serif" font-size="14.5" font-style="italic" font-weight="500" fill="#BE3A22">unlike the whiteboard, this one keeps the notes</text>
</svg>
