<svg viewBox="0 0 420 250" role="img" aria-labelledby="pa-t pa-d" class="drawn">
  <title id="pa-t">The pilot and the autopilot</title>
  <desc id="pa-d">A cockpit dashboard with an autopilot switch set to on and a hand resting near the controls, ready
    to take over. A red note reads: autopilot flies, you watch and can take over.</desc>
  <defs>
    <filter id="pa-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="pa-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- dashboard -->
  <g filter="url(#pa-rough)" fill="none" stroke="#232120" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56,70 L364,70 C372,70 376,74 376,82 L376,150 L44,150 L44,82 C44,74 48,70 56,70 Z" stroke-width="2.6"/>
    <!-- dials -->
    <circle cx="108" cy="108" r="24" stroke-width="2.2"/>
    <path d="M108,108 L124,96" stroke-width="2.4" stroke="#BE3A22"/>
    <circle cx="108" cy="108" r="3" fill="#232120" stroke="none"/>
    <circle cx="182" cy="108" r="24" stroke-width="2.2"/>
    <path d="M182,108 L182,90" stroke-width="2.4"/>
    <circle cx="182" cy="108" r="3" fill="#232120" stroke="none"/>
  </g>

  <!-- autopilot switch: ON -->
  <g filter="url(#pa-rough2)" fill="none" stroke="#232120" stroke-linejoin="round">
    <rect x="256" y="92" width="86" height="34" rx="17" stroke-width="2.4"/>
    <circle cx="324" cy="109" r="12" fill="#2C4C77" stroke="#2C4C77"/>
  </g>
  <text x="262" y="86" font-family="Fraunces,serif" font-size="11.5" font-style="italic" fill="#5E5852">autopilot</text>
  <text x="328" y="140" font-family="Fraunces,serif" font-size="12" font-style="italic" font-weight="600" fill="#2C4C77">on</text>

  <!-- hand ready near controls -->
  <g filter="url(#pa-rough)" fill="none" stroke="#232120" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150,206 C150,188 156,176 168,172 C176,169 186,170 190,176 L196,166 C200,160 208,162 208,170 L206,186 C206,198 198,206 186,206 Z"/>
    <path d="M168,176 L168,164 C168,158 176,158 176,164 L176,174" />
    <path d="M176,172 L176,160 C176,154 184,154 184,160 L184,174"/>
  </g>
  <text x="214" y="196" font-family="Fraunces,serif" font-size="12" font-style="italic" fill="#232120">ready to take over</text>

  <!-- red note -->
  <text x="40" y="230" font-family="Fraunces,serif" font-size="14" font-style="italic" font-weight="500" fill="#BE3A22">autopilot flies. you watch, and can take over</text>
</svg>
