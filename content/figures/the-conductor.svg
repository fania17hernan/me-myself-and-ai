<svg viewBox="0 0 420 250" role="img" aria-labelledby="co-t co-d" class="drawn">
  <title id="co-t">The conductor</title>
  <desc id="co-d">A conductor with a raised baton in front of three music stands, keeping the parts in time. A red
    note reads: many parts, kept in time.</desc>
  <defs>
    <filter id="co-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="co-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- conductor -->
  <g filter="url(#co-rough)" fill="none" stroke="#232120" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="96" cy="86" r="18" stroke-width="2.6"/>
    <path d="M74,150 C74,130 82,118 96,118 C110,118 118,130 118,150 L118,196 L74,196 Z" stroke-width="2.6"/>
    <!-- both arms raised -->
    <path d="M80,132 C64,124 54,116 46,106" stroke-width="2.4"/>
    <path d="M112,132 C130,122 146,110 160,96" stroke-width="2.4"/>
    <!-- baton -->
    <path d="M160,96 L184,78" stroke-width="2.2" stroke="#BE3A22"/>
  </g>
  <!-- motion ticks by baton -->
  <g filter="url(#co-rough2)" fill="none" stroke="#BE3A22" stroke-width="1.6" stroke-linecap="round" opacity=".8">
    <path d="M188,72 l8,-4 M190,80 l9,-2 M186,64 l6,-6"/>
  </g>

  <!-- three music stands -->
  <g filter="url(#co-rough)" fill="none" stroke="#232120" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M236,120 L284,116 L284,146 L236,150 Z"/>
    <path d="M260,150 L260,196 M244,196 L276,196"/>
    <path d="M300,120 L348,116 L348,146 L300,150 Z"/>
    <path d="M324,150 L324,196 M308,196 L340,196"/>
    <path d="M268,96 L316,92 L316,110 L268,114 Z"/>
    <path d="M292,114 L292,120"/>
  </g>
  <!-- notes on stands -->
  <g filter="url(#co-rough2)" fill="none" stroke="#5E5852" stroke-width="1.5" stroke-linecap="round" opacity=".7">
    <path d="M244,128 L276,125 M244,136 L276,133"/>
    <path d="M308,128 L340,125 M308,136 L340,133"/>
  </g>

  <!-- red note -->
  <text x="40" y="232" font-family="Fraunces,serif" font-size="14.5" font-style="italic" font-weight="500" fill="#BE3A22">many parts, kept in time</text>
</svg>
