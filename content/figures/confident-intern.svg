<svg viewBox="0 0 420 250" role="img" aria-labelledby="ci-t ci-d" class="drawn">
  <title id="ci-t">The confident intern</title>
  <desc id="ci-d">An intern standing at an easel, one hand raised, presenting a chart with a wrong figure on it.
    A speech bubble reads "Absolutely." A red note reads: sounds certain, still made it up.</desc>
  <defs>
    <filter id="ci-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="ci-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ci-hatch" width="9" height="9" patternTransform="rotate(38)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#BE3A22" stroke-width="2.1" opacity=".5"/>
    </pattern>
  </defs>

  <!-- easel -->
  <g filter="url(#ci-rough)" fill="none" stroke="#232120" stroke-linecap="round" stroke-linejoin="round">
    <path d="M232,58 L360,58 C366,58 370,62 370,68 L370,150 C370,156 366,160 360,160 L232,160 C226,160 222,156 222,150 L222,68 C222,62 226,58 232,58 Z" stroke-width="2.6"/>
    <path d="M244,160 L232,224" stroke-width="2.4"/>
    <path d="M348,160 L360,224" stroke-width="2.4"/>
    <path d="M296,160 L296,214" stroke-width="2" opacity=".55"/>
  </g>

  <!-- wrong chart: rising bars, last one wildly off, hatched red -->
  <g filter="url(#ci-rough2)" stroke="#232120" stroke-linejoin="round">
    <rect x="244" y="128" width="20" height="20" fill="none" stroke-width="2"/>
    <rect x="274" y="112" width="20" height="36" fill="none" stroke-width="2"/>
    <rect x="304" y="96" width="20" height="52" fill="none" stroke-width="2"/>
    <rect x="334" y="72" width="20" height="76" fill="url(#ci-hatch)" stroke="#BE3A22" stroke-width="2"/>
  </g>
  <text x="330" y="66" font-family="Fraunces,serif" font-size="13" font-style="italic" font-weight="600" fill="#BE3A22">?</text>

  <!-- intern: head, torso, raised arm -->
  <g filter="url(#ci-rough)" fill="none" stroke="#232120" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="96" cy="86" r="24" stroke-width="2.6"/>
    <path d="M70,150 C70,128 80,116 96,116 C112,116 122,128 122,150 L122,196 C122,200 118,202 112,202 L80,202 C74,202 70,200 70,196 Z" stroke-width="2.6"/>
    <!-- raised arm pointing at the chart -->
    <path d="M120,132 C144,120 168,112 196,104" stroke-width="2.4"/>
    <path d="M188,98 L199,103 L191,112" stroke-width="2.2"/>
  </g>
  <!-- little confident smile -->
  <g filter="url(#ci-rough2)" fill="none" stroke="#232120" stroke-linecap="round">
    <path d="M86,92 C91,97 101,97 106,92" stroke-width="1.8"/>
    <path d="M84,80 L90,80 M102,80 L108,80" stroke-width="1.8"/>
  </g>

  <!-- speech bubble -->
  <g filter="url(#ci-rough2)" fill="#F1EEE7" stroke="#2C4C77" stroke-linejoin="round">
    <path d="M104,40 C104,32 110,28 120,28 L176,28 C186,28 192,32 192,40 L192,58 C192,66 186,70 176,70 L128,70 L114,82 L118,70 C110,69 104,65 104,58 Z" stroke-width="2.2"/>
  </g>
  <text x="118" y="55" font-family="Fraunces,serif" font-size="15" font-style="italic" font-weight="600" fill="#2C4C77">Absolutely.</text>

  <!-- red note -->
  <g filter="url(#ci-rough2)" fill="none" stroke="#BE3A22" stroke-width="1.9" stroke-linecap="round">
    <path d="M150,208 C164,214 182,214 200,210"/>
    <path d="M192,204 L201,210 L192,216"/>
  </g>
  <text x="40" y="234" font-family="Fraunces,serif" font-size="14.5" font-style="italic" font-weight="500" fill="#BE3A22">sounds certain, still made it up</text>
</svg>
