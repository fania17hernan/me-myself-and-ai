<svg viewBox="0 0 420 250" role="img" aria-labelledby="dk-t dk-d" class="drawn">
  <title id="dk-t">The dining room and the kitchen</title>
  <desc id="dk-d">A dining room with a set table on the left and a kitchen with a stove on the right, split by a
    swinging door. A red note reads: the room you see, the kitchen you don't.</desc>
  <defs>
    <filter id="dk-rough" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="6" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="dk-rough2" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- swinging door divider -->
  <g filter="url(#dk-rough2)" stroke="#5E5852" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M210,60 L210,196"/>
    <path d="M198,120 C204,116 216,116 222,120" opacity=".7"/>
  </g>

  <!-- dining room: table set -->
  <g filter="url(#dk-rough)" fill="none" stroke="#232120" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56,150 L164,150 L164,158 L56,158 Z" stroke-width="2.6"/>
    <path d="M68,158 L68,190 M152,158 L152,190" stroke-width="2.4"/>
    <ellipse cx="96" cy="140" rx="18" ry="7" stroke-width="2.2"/>
    <ellipse cx="96" cy="139" rx="9" ry="3.5" stroke-width="1.4" opacity=".6"/>
    <path d="M126,132 L126,146 M134,132 L134,146" stroke-width="2"/>
  </g>
  <text x="70" y="182" font-family="Fraunces,serif" font-size="12.5" font-style="italic" fill="#232120">dining room</text>

  <!-- kitchen: stove + pot + steam -->
  <g filter="url(#dk-rough)" fill="none" stroke="#232120" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256,150 L364,150 L364,192 L256,192 Z" stroke-width="2.6"/>
    <circle cx="284" cy="150" r="10" stroke-width="2"/>
    <circle cx="336" cy="150" r="10" stroke-width="2"/>
    <path d="M300,138 L340,138 L336,150 L304,150 Z" stroke-width="2.2"/>
    <path d="M340,142 C348,142 348,150 340,150" stroke-width="1.8"/>
    <path d="M312,126 C315,122 312,120 314,116 M326,126 C329,122 326,120 328,116" stroke-width="1.6" opacity=".55"/>
  </g>
  <text x="284" y="182" font-family="Fraunces,serif" font-size="12.5" font-style="italic" fill="#232120">kitchen</text>

  <!-- red note -->
  <text x="40" y="224" font-family="Fraunces,serif" font-size="14.5" font-style="italic" font-weight="500" fill="#BE3A22">the room you see, the kitchen you don't</text>
</svg>
