# The controlled vocabulary. This file is the spine of the taxonomy.
# A unit may only claim to teach a term that exists here, and the build
# fails otherwise. That single rule is what stops the glossary and the
# curriculum from quietly disagreeing six months from now.
#
# `taught_by` is DERIVED at build time. Do not hand-edit it.

- id: token
  term_en: "Token"
  term_es: "Token"
  plain_en: "A chunk of a word. It's the unit AI reads and writes, roughly three-quarters of a word."
  plain_es: "Un pedazo de palabra. Es la unidad que la IA lee y escribe, más o menos tres cuartas partes de una palabra."
  volatility: evergreen
  related: [rate-limit, context-window]

- id: rate-limit
  term_en: "Rate limit"
  term_es: "Límite de uso"
  plain_en: "A cap on how much you can use a tool in a given window. Like a gas station that only lets you fill up so many times an hour."
  plain_es: "Un tope de cuánto puedes usar una herramienta en cierto tiempo. Como una gasolinera que solo te deja llenar el tanque unas cuantas veces por hora."
  volatility: evergreen
  related: [token]

- id: context-window
  term_en: "Context window"
  term_es: "Ventana de contexto"
  plain_en: "How much the AI can hold in mind at once. Everything earlier in the conversation counts against it."
  plain_es: "Cuánto puede tener presente la IA a la vez. Todo lo anterior de la conversación cuenta."
  volatility: slow
  related: [token]

- id: truncation
  term_en: "Truncation"
  term_es: "Corte de respuesta"
  plain_en: "When an answer stops mid-sentence because it ran out of room. Not an error, just an empty tank."
  plain_es: "Cuando una respuesta se detiene a media frase porque se quedó sin espacio. No es un error, es el tanque vacío."
  volatility: evergreen
  related: [token, rate-limit]

- id: confabulation
  term_en: "Confabulation"
  term_es: "Confabulación"
  plain_en: "When AI states something false with complete confidence. Not lying, which would require knowing the truth."
  plain_es: "Cuando la IA afirma algo falso con total seguridad. No es mentir, porque mentir exige saber la verdad."
  volatility: evergreen
  related: [token]

- id: training-data
  term_en: "Training data"
  term_es: "Datos de entrenamiento"
  plain_en: "The text a model learned patterns from, fixed at a point in the past. Not a live memory of your conversations."
  plain_es: "El texto del que un modelo aprendió patrones, fijado en un momento del pasado. No es una memoria viva de tus conversaciones."
  volatility: slow
  related: [confabulation]

- id: prompt
  term_en: "Prompt"
  term_es: "Instrucción"
  plain_en: "What you ask for. The difference between a vague one and a specific one is most of the difference in what you get back."
  plain_es: "Lo que pides. La diferencia entre una vaga y una específica explica casi toda la diferencia en lo que recibes."
  volatility: evergreen
  related: [token]

- id: plan-tier
  term_en: "Plan tier"
  term_es: "Tipo de plan"
  plain_en: "The level of access you pay for. A free tier with tight limits, or a paid tier with more room, faster answers, and extra features."
  plain_es: "El nivel de acceso que pagas. Un plan gratis con límites ajustados, o un plan de pago con más espacio, respuestas más rápidas y funciones extra."
  volatility: slow
  related: [rate-limit]

- id: workflow
  term_en: "Workflow"
  term_es: "Flujo de trabajo"
  plain_en: "A repeatable set of steps you hand the AI in order, so a task runs the same way every time instead of starting from scratch."
  plain_es: "Un conjunto de pasos que le das a la IA en orden y se puede repetir, para que una tarea salga igual cada vez en lugar de empezar de cero."
  volatility: evergreen
  related: [prompt]

- id: project
  term_en: "Project"
  term_es: "Proyecto"
  plain_en: "A dedicated space that keeps all the chats, files, and instructions for one job together, instead of a single chat that ends and is gone."
  plain_es: "Un espacio dedicado que mantiene juntos todos los chats, archivos e instrucciones de un mismo trabajo, en vez de un chat suelto que termina y desaparece."
  volatility: slow
  related: [context-window]

- id: artifact
  term_en: "Artifact"
  term_es: "Artefacto"
  plain_en: "The actual thing the AI builds beside the conversation, a document, a table, a small app, that you can edit live instead of copying out of the chat."
  plain_es: "La cosa que la IA construye junto a la conversación, un documento, una tabla, una pequeña app, que puedes editar en vivo en lugar de copiarla del chat."
  volatility: slow
  related: [project]

- id: connector
  term_en: "Connector"
  term_es: "Conector"
  plain_en: "A link you approve that lets the AI reach into another tool, your email, calendar, or files, to fetch and file things for you."
  plain_es: "Un enlace que tú apruebas y que le permite a la IA entrar a otra herramienta, tu correo, calendario o archivos, para traer y guardar cosas por ti."
  volatility: slow
  related: [project]

- id: custom-assistant
  term_en: "Custom assistant"
  term_es: "Asistente personalizado"
  plain_en: "A helper you set up once for a recurring task, with its instructions saved, so it behaves the same way every time without re-explaining."
  plain_es: "Un ayudante que configuras una vez para una tarea repetitiva, con sus instrucciones guardadas, para que actúe igual cada vez sin volver a explicarle."
  volatility: slow
  related: [prompt, workflow]

- id: multimodal
  term_en: "Multimodal"
  term_es: "Multimodal"
  plain_en: "Able to work with more than text. The same AI can also take in images, voice, and audio, and sometimes produce them."
  plain_es: "Capaz de trabajar con más que texto. La misma IA también puede recibir imágenes, voz y audio, y a veces producirlos."
  volatility: slow
  related: [model]

- id: model
  term_en: "Model"
  term_es: "Modelo"
  plain_en: "The particular AI engine you're talking to. Tools offer several, trading speed and cost against power, like choosing a vehicle for a trip."
  plain_es: "El motor de IA concreto con el que hablas. Las herramientas ofrecen varios, que cambian velocidad y costo por potencia, como elegir un vehículo para un viaje."
  volatility: slow
  related: [plan-tier]

- id: custom-instructions
  term_en: "Custom instructions"
  term_es: "Instrucciones personalizadas"
  plain_en: "Standing preferences the AI follows on every chat, like how to address you or how long answers should be, so you stop repeating them."
  plain_es: "Preferencias permanentes que la IA sigue en cada chat, como cómo dirigirse a ti o qué tan largas deben ser las respuestas, para que dejes de repetirlas."
  volatility: evergreen
  related: [prompt, custom-assistant]

- id: memory
  term_en: "Memory"
  term_es: "Memoria"
  plain_en: "A notebook the AI keeps across chats, holding facts it learned about you, unlike the whiteboard that wipes when a chat ends."
  plain_es: "Un cuaderno que la IA conserva entre chats, con datos que aprendió sobre ti, a diferencia del pizarrón que se borra al terminar un chat."
  volatility: slow
  related: [context-window]

- id: template
  term_en: "Template"
  term_es: "Plantilla"
  plain_en: "A prompt you saved to reuse. Write the good version once, keep it in a box, and pull it out instead of retyping."
  plain_es: "Una instrucción que guardaste para reutilizar. Escribe la buena versión una vez, guárdala en una caja y sácala en lugar de reescribirla."
  volatility: evergreen
  related: [prompt, workflow]
